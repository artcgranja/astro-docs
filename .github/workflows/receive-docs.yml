name: Receive Docs

on:
  repository_dispatch:
    types:
      - sync-anchor-docs
      - sync-stick-docs

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout astro-docs
        uses: actions/checkout@v4

      - name: Determine source repo and project
        id: config
        env:
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          case "${EVENT_ACTION}" in
            sync-anchor-docs)
              echo "repo=artcgranja/anchor" >> "$GITHUB_OUTPUT"
              echo "project=anchor" >> "$GITHUB_OUTPUT"
              echo "docs_dir=docs/docs" >> "$GITHUB_OUTPUT"
              ;;
            sync-stick-docs)
              echo "repo=artcgranja/stick-backend" >> "$GITHUB_OUTPUT"
              echo "project=stick" >> "$GITHUB_OUTPUT"
              echo "docs_dir=docs" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Clone source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.repo }}
          path: _source
          token: ${{ secrets.DOCS_SYNC_TOKEN }}

      - name: Sync content
        run: |
          PROJECT="${{ steps.config.outputs.project }}"
          DOCS_DIR="${{ steps.config.outputs.docs_dir }}"
          DEST="content/docs/${PROJECT}"

          rm -rf "${DEST}"
          mkdir -p "${DEST}"

          rsync -av --exclude='mkdocs.yml' \
                    --exclude='overrides/' \
                    --exclude='includes/' \
                    --exclude='stylesheets/' \
                    --exclude='.gitignore' \
                    "_source/${DOCS_DIR}/" "${DEST}/"

          rm -rf _source

      - name: Commit and push
        env:
          PROJECT: ${{ steps.config.outputs.project }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: sync ${PROJECT} docs"
            git push
          fi
