name: Receive Docs Update

on:
  repository_dispatch:
    types: [sync-anchor-docs]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clear existing anchor docs
        run: rm -rf src/content/docs/anchor

      - name: Clone anchor repo
        run: git clone --depth 1 https://github.com/artcgranja/anchor.git /tmp/anchor

      - name: Copy docs
        run: cp -r /tmp/anchor/docs/docs/ src/content/docs/anchor/

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync anchor docs"
          git push
